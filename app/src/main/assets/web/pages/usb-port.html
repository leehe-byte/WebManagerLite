<div class="card">
    <div class="card-header">
        <h3>🔌 USB 端口切换</h3>
        <span id="usb-status-badge" class="status-badge" style="background: #eee; border-color: #ccc; color: #888;">检测中...</span>
    </div>
    <div class="info-table">
        <div class="operator-line">
            <div class="op-brand">
                <h2 id="usb-status-text">正在获取状态...</h2>
            </div>
            <div class="ios-switch">
                <input type="checkbox" id="usb-toggle">
                <label for="usb-toggle" class="ios-slider"></label>
            </div>
        </div>
    </div>
</div>

<div class="card">
    <div class="card-header">
        <h3>ℹ️ 说明</h3>
    </div>
    <div style="font-size: 13px; color: #666; line-height: 1.6;">
        <p>1. USB 端口切换用于控制设备的 USB 调试/数据接口状态。</p>
        <p>2. 开启后可通过 USB 连接设备进行调试或数据传输。</p>
    </div>
</div>
